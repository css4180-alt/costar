name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  STACK_NAME: costar

jobs:
  # ── 1) 테스트: 실제 AWS 없이 moto로 전부 모킹 ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "moto[all]" ruff httpx

      - name: Ruff 린트
        working-directory: backend
        run: ruff check app tests

      - name: Pytest
        working-directory: backend
        run: pytest -q

  # ── 2) 배포: main push에서만. OIDC로 AWS 인증(정적 키 없음). ────────────────
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격 증명(OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SAM 설치
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM 빌드(컨테이너 이미지 포함)
        run: sam build --template infra/template.yaml

      - name: SAM 배포
        run: |
          sam deploy \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --resolve-image-repos --resolve-s3 \
            --parameter-overrides \
              AccessCodes="${{ secrets.ACCESS_CODES }}" \
              AuthSecret="${{ secrets.AUTH_SECRET }}" \
              TmdbApiKey="${{ secrets.TMDB_API_KEY }}"

      - name: 스택 출력 읽기
        id: stack
        env:
          # 일시적 네트워크 오류(연결 타임아웃)에 대비한 재시도 설정.
          AWS_MAX_ATTEMPTS: '5'
          AWS_RETRY_MODE: standard
        run: |
          read_output() {
            for i in 1 2 3 4 5; do
              val=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text) && \
                [ -n "$val" ] && { echo "$val"; return 0; }
              echo "  ($1) 재시도 $i/5..." >&2; sleep 5
            done
            return 1
          }
          SITE_BUCKET=$(read_output SiteBucketName)
          DIST_ID=$(read_output DistributionId)
          echo "site_bucket=$SITE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 정적 파일 S3 동기화
        run: aws s3 sync frontend/dist "s3://${{ steps.stack.outputs.site_bucket }}" --delete

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.dist_id }}" \
            --paths "/*"
