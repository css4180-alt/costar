AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CoStar — 서버리스 얼굴 인식 공동 출연 서비스.
  Lambda(컨테이너) + Function URL + DynamoDB + S3(미디어/정적) + CloudFront + Rekognition.
  리전: ap-northeast-2(서울). CloudFront 기본 도메인 사용($0, ACM 불필요).

# ─────────────────────────────────────────────────────────────────────────────
# 파라미터 — 시크릿(AccessCodes/AuthSecret)은 NoEcho. CI에서 GitHub Secrets로 주입.
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  AccessCodes:
    Type: String
    NoEcho: true
    Default: ''
    Description: '"패스코드:계정,..." 형식. 비우면 인증/쿼터 OFF(로컬/데모).'
  AuthSecret:
    Type: String
    NoEcho: true
    Default: dev-insecure-secret-change-me
    Description: 토큰 서명용 HMAC 시크릿.
  RekognitionCollectionId:
    Type: String
    Default: costar-persons
  FaceMatchThreshold:
    Type: Number
    Default: 90
  DetectMinConfidence:
    Type: Number
    Default: 80
  PresignTtlSeconds:
    Type: Number
    Default: 600
  DailyFacesPerAccount:
    Type: Number
    Default: 500
  SiteDailyFacesLimit:
    Type: Number
    Default: 3000
  TokenTtlHours:
    Type: Number
    Default: 24
  TmdbApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: TMDB v3 API 키(작품 임포트용). 비우면 임포트 비활성.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  # ── DynamoDB 단일 테이블 ─────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: costar
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 미디어 버킷(원본 이미지, 완전 비공개 — presigned URL로만 접근) ──────
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub costar-media-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3

  # ── S3 정적 버킷(Vue SPA, 비공개 — CloudFront OAC로만 접근) ────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub costar-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ── Lambda(FastAPI + Mangum, 컨테이너 이미지) ────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          REKOGNITION_COLLECTION_ID: !Ref RekognitionCollectionId
          FACE_MATCH_THRESHOLD: !Ref FaceMatchThreshold
          DETECT_MIN_CONFIDENCE: !Ref DetectMinConfidence
          DDB_TABLE: !Ref Table
          S3_BUCKET: !Ref MediaBucket
          PRESIGN_TTL_SECONDS: !Ref PresignTtlSeconds
          ACCESS_CODES: !Ref AccessCodes
          AUTH_SECRET: !Ref AuthSecret
          # CloudFront origin이 주입하는 비밀 헤더 값(직접 호출 차단용).
          # AuthSecret을 재사용해 추가 시크릿 없이 게이트한다.
          ORIGIN_VERIFY_SECRET: !Ref AuthSecret
          DAILY_FACES_PER_ACCOUNT: !Ref DailyFacesPerAccount
          SITE_DAILY_FACES_LIMIT: !Ref SiteDailyFacesLimit
          TOKEN_TTL_HOURS: !Ref TokenTtlHours
          TMDB_API_KEY: !Ref TmdbApiKey
          IMPORT_QUEUE_URL: !Ref ImportQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ImportQueue.QueueName
        - Statement:
            - Sid: Rekognition
              Effect: Allow
              Action:
                - rekognition:CreateCollection
                - rekognition:IndexFaces
                - rekognition:SearchFacesByImage
                - rekognition:DetectFaces
                - rekognition:DeleteFaces
                - rekognition:ListCollections
              Resource: '*'
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
    Metadata:
      DockerContext: ../backend
      Dockerfile: Dockerfile
      DockerTag: latest

  # API Gateway(HTTP API): Lambda 프록시. Lambda Function URL은 이 계정에서
  # 공개(AuthType=NONE)가 차단되고, OAC+AWS_IAM은 브라우저 POST 본문 sigv4
  # 서명을 요구해 SPA에 부적합하다. HTTP API는 공개 엔드포인트가 정상 동작하고
  # 모든 메서드/본문을 그대로 처리하며, CloudFront origin이 주입하는 비밀 헤더
  # (X-Origin-Verify)를 Lambda 미들웨어가 검증해 직접 호출을 차단한다.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  # ── 임포트 비동기 처리 (SQS + 워커 Lambda) ───────────────────────────────
  # API는 29초 제한이 있어 출연진 전체 등록을 동기로 못 한다. 작업을 큐에 넣고
  # 워커 Lambda가 최대 15분까지 처리한다(실패는 DLQ로).
  ImportDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub costar-import-dlq-${AWS::StackName}
      MessageRetentionPeriod: 1209600 # 14일

  ImportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub costar-import-${AWS::StackName}
      # 워커 타임아웃(300s)보다 넉넉히 크게 — 처리 중 메시지 재가시 방지.
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ImportDLQ.Arn
        maxReceiveCount: 3

  # 워커: API와 같은 컨테이너 이미지를 쓰되 ImageConfig.Command로 SQS 핸들러를 가리킨다.
  ImportWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Timeout: 300
      ImageConfig:
        Command:
          - app.import_worker.handler
      Environment:
        Variables:
          REKOGNITION_COLLECTION_ID: !Ref RekognitionCollectionId
          FACE_MATCH_THRESHOLD: !Ref FaceMatchThreshold
          DETECT_MIN_CONFIDENCE: !Ref DetectMinConfidence
          DDB_TABLE: !Ref Table
          S3_BUCKET: !Ref MediaBucket
          PRESIGN_TTL_SECONDS: !Ref PresignTtlSeconds
          ACCESS_CODES: !Ref AccessCodes
          AUTH_SECRET: !Ref AuthSecret
          DAILY_FACES_PER_ACCOUNT: !Ref DailyFacesPerAccount
          SITE_DAILY_FACES_LIMIT: !Ref SiteDailyFacesLimit
          TOKEN_TTL_HOURS: !Ref TokenTtlHours
          TMDB_API_KEY: !Ref TmdbApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Sid: Rekognition
              Effect: Allow
              Action:
                - rekognition:CreateCollection
                - rekognition:IndexFaces
                - rekognition:SearchFacesByImage
                - rekognition:DetectFaces
                - rekognition:DeleteFaces
                - rekognition:ListCollections
              Resource: '*'
      Events:
        ImportQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ImportQueue.Arn
            BatchSize: 1
    Metadata:
      DockerContext: ../backend
      Dockerfile: Dockerfile
      DockerTag: latest

  # ── CloudFront OAC(정적 S3 전용) ─────────────────────────────────────────
  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub costar-site-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront 단일 배포: "/*"→정적 S3, "/api/*"→API Gateway(HTTP API) ────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CoStar SPA + API
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api-gateway
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            # 직접 호출 차단용 비밀 헤더(Lambda 미들웨어가 검증).
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref AuthSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS 관리형 CachePolicy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gateway
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # CachingDisabled + AllViewerExceptHostHeader(관리형).
            # Host만 제외하고 전 헤더 전달(Function URL은 자기 도메인을 Host로 받아야 함).
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # SiteBucket은 이 배포(OAC)에서만 GetObject 허용.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  CloudFrontUrl:
    Description: 데모 접속 URL(CloudFront 기본 도메인)
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Description: CloudFront 배포 ID(무효화용)
    Value: !Ref Distribution
  SiteBucketName:
    Description: 프론트 정적 버킷(빌드 산출물 동기화 대상)
    Value: !Ref SiteBucket
  MediaBucketName:
    Description: 원본 이미지 버킷
    Value: !Ref MediaBucket
  TableName:
    Value: !Ref Table
