AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CoStar 부트스트랩(1회, 수동 배포). GitHub Actions가 정적 키 없이 AWS에 배포할 수
  있도록 GitHub OIDC Provider와 배포 역할을 만든다. 리전: ap-northeast-2.

  배포 예:
    aws cloudformation deploy \
      --region ap-northeast-2 \
      --template-file infra/oidc-bootstrap.yaml \
      --stack-name costar-oidc \
      --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides GitHubOrg=css4180-alt GitHubRepo=costar

  출력된 DeployRoleArn을 GitHub 리포 Secret `AWS_DEPLOY_ROLE_ARN`에 등록한다.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub 사용자/조직 이름
  GitHubRepo:
    Type: String
    Default: costar
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: 계정에 GitHub OIDC Provider가 이미 있으면 false.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub의 OIDC thumbprint. (AWS는 이 알려진 공급자에 대해 자체 CA로
      # 검증하지만 ThumbprintList는 필수 속성이라 채워 둔다.)
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: costar-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # 해당 리포의 워크플로에서만 이 역할을 가정할 수 있게 제한.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      # 배포(sam deploy + S3 sync + CloudFront 무효화)에 필요한 권한.
      # 부트스트랩 성격상 다소 광범위하며, 운영화 시 리소스 ARN으로 더 좁힐 수 있다.
      Policies:
        - PolicyName: costar-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Sid: Compute
                Effect: Allow
                Action:
                  - lambda:*
                  - dynamodb:*
                  - cloudfront:*
                Resource: '*'
              - Sid: Storage
                Effect: Allow
                Action:
                  - s3:*
                  - ecr:*
                Resource: '*'
              - Sid: IamForStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: GitHub Secret `AWS_DEPLOY_ROLE_ARN`에 등록할 값
    Value: !GetAtt DeployRole.Arn
