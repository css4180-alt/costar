version = 0.1

# 기본 배포 파라미터. CI(GitHub Actions)와 로컬 `sam deploy` 모두 사용한다.
# 시크릿(AccessCodes/AuthSecret)은 여기 두지 않고 --parameter-overrides로 주입한다.
[default.deploy.parameters]
stack_name = "costar"
region = "ap-northeast-2"
capabilities = "CAPABILITY_IAM"
resolve_image_repos = true
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false

[default.build.parameters]
cached = true
parallel = true
